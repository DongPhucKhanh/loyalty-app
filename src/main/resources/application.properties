spring.application.name=loyaltyapp

# Kết nối MySQL (Thay password của bạn vào đây)
spring.datasource.url=jdbc:mysql://localhost:3306/loyalty_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo bảng từ code Java (Rất tiện cho đồ án)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true