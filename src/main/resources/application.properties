spring.application.name=loyaltyapp

# Kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/loyalty_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SỬA Ở ĐÂY: Đổi từ update -> create để nó xóa bảng cũ lỗi và tạo bảng mới xịn
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true